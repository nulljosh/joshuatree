<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="44" fill="#c1502f"/>
  <!-- Joshua tree silhouette: trunk, two branching arms, spiky yucca tufts -->
  <g fill="none" stroke="#241408" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 168 L100 108"/>
    <path d="M100 130 L68 92"/>
    <path d="M100 118 L134 84"/>
    <path d="M100 108 L100 66"/>
  </g>
  <g stroke="#241408" stroke-width="6" stroke-linecap="round">
    <!-- tuft: trunk top -->
    <line x1="100" y1="66" x2="86" y2="46"/>
    <line x1="100" y1="66" x2="100" y2="40"/>
    <line x1="100" y1="66" x2="114" y2="46"/>
    <!-- tuft: left arm -->
    <line x1="68" y1="92" x2="54" y2="76"/>
    <line x1="68" y1="92" x2="52" y2="94"/>
    <line x1="68" y1="92" x2="60" y2="108"/>
    <!-- tuft: right arm -->
    <line x1="134" y1="84" x2="150" y2="68"/>
    <line x1="134" y1="84" x2="150" y2="86"/>
    <line x1="134" y1="84" x2="142" y2="100"/>
  </g>
  <rect x="66" y="168" width="68" height="10" rx="5" fill="#241408" opacity="0.5"/>
</svg>
