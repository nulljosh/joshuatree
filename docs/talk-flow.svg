<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" style="background:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif" viewBox="0 0 640 600">
<text x="320" y="28" fill="#333" font-size="16" font-weight="600" text-anchor="middle">What happens when you talk to Samantha</text>
<rect width="200" height="40" x="220" y="55" fill="#f5f5f7" stroke="#d1d1d6" rx="8"/>
<text x="320" y="74" fill="#333" font-size="9" text-anchor="middle">You</text>
<text x="320" y="84" fill="#333" font-size="9" text-anchor="middle">type: remind me to call Mom</text>
<rect width="200" height="40" x="220" y="145" fill="#2f6b3a" fill-opacity=".15" stroke="#2f6b3a" rx="8"/>
<text x="320" y="164" fill="#333" font-size="9" font-weight="500" text-anchor="middle">Samantha app</text>
<text x="320" y="174" fill="#333" font-size="9" font-weight="500" text-anchor="middle">in Joshua Tree, sends your words out</text>
<rect width="160" height="30" x="145" y="235" fill="#f0f0f0" stroke="#ccc" rx="6"/>
<text x="225" y="248" fill="#666" font-size="10" text-anchor="middle">Cloudflare Worker</text>
<text x="225" y="260" fill="#666" font-size="10" text-anchor="middle">carries it to the internet</text>
<rect width="160" height="30" x="335" y="235" fill="#f0f0f0" stroke="#ccc" rx="6"/>
<text x="415" y="249" fill="#666" font-size="8" text-anchor="middle">Turing</text>
<text x="415" y="259" fill="#666" font-size="8" text-anchor="middle">picks the tool or writes the answer</text>
<rect width="200" height="40" x="220" y="325" fill="#2f6b3a" fill-opacity=".15" stroke="#2f6b3a" rx="8"/>
<text x="320" y="343" fill="#333" font-size="10" font-weight="500" text-anchor="middle">Joshua Tree does it</text>
<text x="320" y="355" fill="#333" font-size="10" font-weight="500" text-anchor="middle">sets the reminder, opens the app</text>
<rect width="160" height="30" x="240" y="415" fill="#f0f0f0" stroke="#ccc" rx="6"/>
<text x="320" y="429" fill="#666" font-size="8" text-anchor="middle">ElevenLabs</text>
<text x="320" y="439" fill="#666" font-size="8" text-anchor="middle">turns her answer into her voice</text>
<rect width="200" height="40" x="105" y="505" fill="#2f6b3a" fill-opacity=".15" stroke="#2f6b3a" rx="8"/>
<text x="205" y="522" fill="#333" font-size="12" font-weight="500" text-anchor="middle">Sound Blaster driver</text>
<text x="205" y="536" fill="#333" font-size="12" font-weight="500" text-anchor="middle">plays her voice</text>
<rect width="200" height="40" x="335" y="505" fill="#2f6b3a" fill-opacity=".15" stroke="#2f6b3a" rx="8"/>
<text x="435" y="522" fill="#333" font-size="12" font-weight="500" text-anchor="middle">Her face</text>
<text x="435" y="536" fill="#333" font-size="12" font-weight="500" text-anchor="middle">mouth moves with each sound</text>
<path stroke="#d1d1d6" fill="none" d="M320 95V145M320 185V210M225 210v25M415 210v25M225 210H415M225 265v30M415 265v30M225 295H415M320 295V325M320 365V415M320 445V475M205 475v30M435 475v30M205 475H435"/>
</svg>
