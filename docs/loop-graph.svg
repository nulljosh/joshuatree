<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Tree Sans, -apple-system, BlinkMacSystemFont, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b5502c"/></marker></defs>
<rect width="640" height="600" fill="#faf8f4"/>
<text x="320" y="38" font-size="20" font-weight="600" fill="#1c1c1e" text-anchor="middle">The Joshua Tree loop</text>
<text x="320" y="58" font-size="12" fill="#75726e" text-anchor="middle">one task at a time, from the roadmap to a release</text>
<g font-size="14" font-weight="600" fill="#1c1c1e" text-anchor="middle">
<rect x="190" y="84" width="260" height="52" rx="12" fill="#f5f0eb" stroke="#ddd8ce"/><text x="320" y="106">Roadmap</text><text x="320" y="124" font-size="11" font-weight="400" fill="#75726e">docs/roadmap.md, the open items</text>
<rect x="190" y="170" width="260" height="52" rx="12" fill="#f5f0eb" stroke="#ddd8ce"/><text x="320" y="192">Main session</text><text x="320" y="210" font-size="11" font-weight="400" fill="#75726e">picks one item, decides, verifies</text>
<rect x="190" y="256" width="260" height="52" rx="12" fill="#f5f0eb" stroke="#ddd8ce"/><text x="320" y="278">One agent</text><text x="320" y="296" font-size="11" font-weight="400" fill="#75726e">its own worktree and branch, one slice</text>
<rect x="190" y="342" width="260" height="52" rx="12" fill="#f5f0eb" stroke="#ddd8ce"/><text x="320" y="364">Local checks, headless</text><text x="320" y="382" font-size="11" font-weight="400" fill="#75726e">QEMU, no window, real artifacts</text>
<rect x="190" y="428" width="260" height="52" rx="12" fill="#f5f0eb" stroke="#ddd8ce"/><text x="320" y="450">Draft PR, then ready</text><text x="320" y="468" font-size="11" font-weight="400" fill="#75726e">GitHub CI runs when it is ready</text>
<rect x="190" y="514" width="260" height="52" rx="12" fill="#b5502c" stroke="#b5502c"/><text x="320" y="536" fill="#faf8f4">Merge on green, release</text><text x="320" y="554" font-size="11" font-weight="400" fill="#faf8f4">VERSION bump cuts the tag</text>
</g>
<g stroke="#b5502c" stroke-width="1.6" fill="none" marker-end="url(#a)">
<path d="M320 136V168"/><path d="M320 222V254"/><path d="M320 308V340"/><path d="M320 394V426"/><path d="M320 480V512"/>
</g>
<path d="M450 540H560V110H452" fill="none" stroke="#b5502c" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="574" y="330" font-size="11" fill="#75726e" transform="rotate(90 574 330)" text-anchor="middle">next item</text>
</svg>
