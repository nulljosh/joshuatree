name: Boot check
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# v0.76.8: this session pushes to main frequently enough (several times an
# hour some days) that back-to-back pushes were queuing overlapping runs on
# the same ref -- wasted CI minutes, and a slower/earlier run finishing
# after a newer one could paint a stale, misleading status on the commit
# that's actually current. Only the latest push's result matters for a
# status check, so superseding an in-flight run on the same ref is safe
# here (this job has no side effects to leave half-done, unlike deploy.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR that only touches prose (any .md except docs/roadmap.md, which the
  # landing checks read) skips the QEMU suite; `check` still reports green.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          if echo "$files" | grep -qvE '\.md$' || echo "$files" | grep -qx 'docs/roadmap.md'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # The suite runs as four parallel shards (ci-suite.sh SHARD/SHARDS),
  # about a quarter of the wall time each. `check` below stays the one
  # required status and passes only when every shard did.
  suite:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Pinned, not `ubuntu-latest`. `latest` silently rolls to the next LTS
    # image, which swaps the clang/qemu/PIL versions underneath every check
    # in this file at a moment GitHub picks, not one this repo picks -- the
    # exact shape of "it was green yesterday and red today with no commit
    # in between". Bump this line deliberately when the toolchain should
    # move, so the bump is a commit that CI itself proves out.
    runs-on: ubuntu-24.04
    # A wedged QEMU process (hung boot, a script waiting forever on a socket
    # that will never answer) used to have no ceiling: the job would sit
    # "in_progress" indefinitely, which reads the same as "still fine" on
    # a status badge instead of the real failure it is. The suite also
    # gives each individual check its own 5-minute ceiling, so a single
    # wedged QEMU is one named FAIL rather than a job-level timeout that
    # takes every check after it down with no result. 30 minutes leaves
    # room for the suite's one automatic retry of timing-sensitive checks
    # on top of the ~6 minutes it really takes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # fetch-depth: 0 for the kernel.elf sync step at the end of this job,
      # which compares real commit ancestry. It used to paper over the
      # default shallow clone with `git fetch --unshallow || true`, which
      # cannot fail loudly: if the unshallow did not happen, merge-base
      # just answered from a truncated history and the check quietly
      # stopped meaning anything.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Landing roadmap summary regression checks
        run: python3 tools/checks/landing-roadmap-check.py
      - name: Install clang, lld, qemu, FAT disk tools, ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld qemu-system-x86 python3-pil librsvg2-bin mtools dosfstools ccache xorriso
      # The old cache step pointed at /var/cache/apt/archives, which apt on
      # the runner empties after a successful install, so it restored an
      # empty directory every run and saved an empty one back: a cache that
      # never held anything. ccache is the real build cache here -- the
      # kernel is ~25 translation units rebuilt from scratch on every run,
      # and a docs-only or checks-only push (most pushes to this repo)
      # recompiles all of them byte-identically. Ubuntu's ccache package
      # ships /usr/lib/ccache/clang, so putting it first on PATH makes the
      # Makefile's own `CC := clang` resolve through it with no Makefile
      # change and no behaviour change on a cache miss.
      - name: Cache compiled objects (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu-24.04-${{ hashFiles('kernel/**', 'drivers/**', 'boot/**', 'lib/**', 'Makefile') }}
          restore-keys: |
            ccache-ubuntu-24.04-
      - name: Build
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          export PATH="/usr/lib/ccache:$PATH"
          ccache --zero-stats
          make kernel.elf
          ccache --show-stats
      # One step, the whole suite. tools/checks/ci-suite.sh holds the
      # manifest and the per-check comments that used to live here as ~40
      # separate workflow steps. That shape stopped the job at the first
      # failure, so one timing flake hid the real state of every check
      # after it and each fix revealed only the next failure, one six
      # minute run at a time. The suite now runs everything, prints a full
      # pass/fail summary, and fails the job if any check failed.
      - name: Regression suite (all checks, full summary)
        run: SHARD=${{ matrix.shard }} SHARDS=4 ./tools/checks/ci-suite.sh
      # A check that fails only on the runner is unreadable from the log
      # alone. Keep what every check leaves in /tmp (serial logs, raw
      # framebuffer dumps, PNGs) so the failure can be looked at, not guessed.
      - name: Keep serial logs and screen dumps from a failed shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-evidence
          path: |
            /tmp/jt-*
            /tmp/*.log
          retention-days: 7
          if-no-files-found: ignore

  # 1.0.13: the one browser-driven check in this repo that actually gates
  # merges, so it gets its own job rather than a spot in ci-suite.sh's
  # shards (those are plain qemu+PIL, no Node/Playwright toolchain at
  # all). demochat-check.mjs proves the landing demo's real Chat app
  # talks to Samantha through the proxied fetch and renders her reply on
  # screen -- hermetic (page.route intercepts /api/proxy, real internet
  # is never touched), so unlike the `network` job below this one is not
  # continue-on-error and does gate `check`.
  #
  # package-lock.json is intentionally gitignored (see .gitignore) --
  # `npm ci` has nothing to lock against, so this uses a plain
  # `npm install` instead, same as any other lockfile-less Node checkout.
  demo:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install clang, lld, qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-x86
      - name: Build kernel.elf (also copies to landing/v86/kernel.elf)
        run: make kernel.elf
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Install a real Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Landing demo Chat check (retries once on a timing flake)
        run: node tools/checks/demochat-check.mjs || (sleep 10 && node tools/checks/demochat-check.mjs)
      - name: Keep the after-reply screenshot from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demochat-evidence
          path: /tmp/jt-demochat-*.png
          retention-days: 7
          if-no-files-found: ignore

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [changes, suite, demo]
    steps:
      - name: Every suite shard (and the demo check) passed
        run: |
          echo "changes: ${{ needs.changes.result }} code=${{ needs.changes.outputs.code }}"
          echo "suite:   ${{ needs.suite.result }}"
          echo "demo:    ${{ needs.demo.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.suite.result }}" = "success" ] || { [ "${{ needs.suite.result }}" = "skipped" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; }
          [ "${{ needs.demo.result }}" = "success" ] || { [ "${{ needs.demo.result }}" = "skipped" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; }

  # CLAUDE.md 4d's own candidate, "a second job for check-refs.sh": pure
  # drift insurance, no clang/qemu/PIL toolchain needed at all, so it runs
  # standalone rather than tacked onto the end of the full build-and-boot
  # job above. Every backtick-quoted file path in roadmap.md/CLAUDE.md/
  # docs/ARCHITECTURE.md must still exist somewhere in the real tree;
  # catches a doc left pointing at a renamed/moved/deleted file, the way
  # roadmap.md's own `/tmp/zoomcap.py` reference (a one-off scratch script
  # that was never meant to be a real path) drifted stale before this job
  # existed to catch it.
  check-refs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Doc file-path references aren't stale
        run: ./tools/checks/check-refs.sh
      - name: landing/version.txt stays in sync with VERSION
        run: ./tools/checks/versionsync-check.sh
      - name: A code PR bumps VERSION, so its merge cuts a release
        if: github.event_name == 'pull_request'
        run: ./tools/checks/version-bump-check.sh "origin/${{ github.base_ref }}"

  # v75: real-network checks. geo-check.sh (v71) and wallpaper-check.py /
  # wallfx-check.py (v75) talk to ip-api.com, Open-Meteo and OpenTopoMap
  # for real; a provider hiccup must not block a kernel push, so this job
  # reports rather than gates. Read its log when it goes red two runs in
  # a row, that is a real regression or a provider change, not noise.
  network:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install clang, lld, qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-x86 python3-pil librsvg2-bin curl
      - name: Build
        run: make kernel.elf
      # Real one-off transient failures (a ConnectionResetError from
      # GitHub's own runner reaching a real external host, e.g. OpenTopoMap
      # resetting connections from GH datacenter IPs) were showing up as a
      # plain red X on the repo's commit-status indicator, even though this
      # job's own continue-on-error already kept them from blocking merges.
      # A retry absorbs a genuine one-off blip; the trailing `|| true`
      # accepts that this specific external host resets GH's IPs often
      # enough that even a retry isn't reliable, and this job was never
      # meant to be a merge gate in the first place, so it shouldn't be a
      # visual alarm either. Read the step's own log for the real PASS/FAIL,
      # that's still accurate, just no longer painted red on a host hiccup.
      - name: Weather location (ip-api + Open-Meteo)
        run: ./tools/checks/geo-check.sh || (sleep 15 && ./tools/checks/geo-check.sh) || true
      - name: Map wallpaper (OpenTopoMap, byte-for-byte vs host)
        run: python3 tools/checks/wallpaper-check.py || (sleep 15 && python3 tools/checks/wallpaper-check.py) || true
      - name: Rain over the map wallpaper
        run: python3 tools/checks/wallfx-check.py rain || (sleep 15 && python3 tools/checks/wallfx-check.py rain) || true
      - name: Satellite wallpaper theme (real geo + tile fetch)
        run: python3 tools/checks/satellite-wallpaper-check.py || (sleep 15 && python3 tools/checks/satellite-wallpaper-check.py) || true
      # 1.0.12: real proof that Chat's compiled-in default (turing.heyitsmejosh.com,
      # port 80, model "samantha") actually answers over plain HTTP -- the
      # sandbox this kernel is normally developed in has that host blocked
      # at its own outbound proxy, so tools/checks/chat-samantha-check.py's
      # own non-live run only ever proves the wire shape against a local
      # fake server. This step boots the real kernel with no llmhost=/
      # llmport= override at all, so the compiled-in default is what's
      # actually exercised, real DNS and a real cross-internet round trip
      # included. If turing.heyitsmejosh.com ever starts forcing HTTPS
      # (which this kernel cannot speak), --live prints that plainly and
      # fails this one step rather than passing silently on a misread.
      - name: Chat reaches the real turing.heyitsmejosh.com:80 (Samantha, plain HTTP)
        run: python3 tools/checks/chat-samantha-check.py --live || (sleep 15 && python3 tools/checks/chat-samantha-check.py --live) || true

  # One status, one gate. main's branch protection used to require three
  # separate contexts: `check`, `check-refs` and `network`. Two real
  # problems with that. First, `network` is continue-on-error by design
  # (it talks to ip-api.com and OpenTopoMap for real, and a provider
  # hiccup must never block a kernel push) -- a required context that is
  # structurally incapable of failing is not a gate, it is 2.5 minutes of
  # waiting painted to look like one. Second, every time a job is added,
  # renamed or split here, protection silently keeps requiring the old
  # name and the new job gates nothing, which is how a job can go red for
  # days without anything noticing.
  #
  # So: protection requires exactly `ci`, and `ci` is this job. It runs no
  # tests of its own, it only reports whether the jobs that actually gate
  # merges passed. Adding or renaming a gating job is a `needs:` edit here
  # and nothing else. `network` is deliberately absent -- read its log,
  # don't merge on it.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [check, check-refs]
    steps:
      - name: Gating jobs all passed
        run: |
          echo "check:      ${{ needs.check.result }}"
          echo "check-refs: ${{ needs.check-refs.result }}"
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.check-refs.result }}" != "success" ]; then
            echo "FAIL: a gating job did not succeed"
            exit 1
          fi
          echo "PASS: every gating job succeeded"
