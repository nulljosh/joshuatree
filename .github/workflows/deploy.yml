name: Deploy landing page

# Direct request: "a push should deploy, default to master or main
# branch." This repo's own house rule up to now was the opposite ("a
# push deploys nothing", see CLAUDE.md) because Cloudflare deploys are
# `wrangler deploy`, a separate manual step from git. That's still true
# locally; this workflow is what actually closes the gap, running that
# same `wrangler deploy` for real whenever main gets a push that touches
# what it serves (the static `landing/` tree wrangler.toml's [assets]
# points at, or the config itself).
# v0.76.8: serialize (never cancel) rather than cancel-in-progress like
# check.yml -- a live `wrangler deploy` has a real external side effect
# mid-flight, so superseding it partway through could leave the deployed
# site in a half-updated state. Queuing a second push's deploy behind the
# first is the safe version of the same fix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, master]
    paths:
      - 'landing/**'
      - 'wrangler.toml'
      - 'worker.js'
      - 'roadmap.md'
      - 'tools/gen/landing-roadmap.py'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync landing page headline to latest roadmap feature
        run: ./tools/gen/inject-landing-headline.sh
      - name: Generate landing roadmap summary
        run: python3 tools/gen/landing-roadmap.py
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
