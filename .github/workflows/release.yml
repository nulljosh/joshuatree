name: Release on version bump

# A merge to main that changes VERSION gets its tag and GitHub release at
# once, with the merged PR's own description as the notes. Before this,
# releases were cut by hand and fell four versions behind (0.85.3 while
# main was on 0.89.0).
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies for ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld xorriso mtools dosfstools
      - name: Build ISO image
        run: |
          make iso
          v=$(tr -d ' \n' < VERSION)
          cp joshuatree.iso "joshuatree-$v.iso"
          shasum -a 256 joshuatree.iso "joshuatree-$v.iso" > SHA256SUMS
          echo "ISO_FILE=joshuatree-$v.iso" >> "$GITHUB_ENV"
      - name: Tag and release if this version has none yet
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \n' < VERSION)
          tag="$v"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          pr=$(gh pr list --state merged --search "$GITHUB_SHA" --json title,body -q '.[0]')
          title=$(echo "$pr" | jq -r '.title // empty' | sed 's/ (#[0-9]*)$//; s/ ([0-9.v]*)$//; s/^[0-9][0-9.]*: *//')
          echo "$pr" | jq -r '.body // empty' | sed '/Generated with \[Claude Code\]/,$d' > notes.md
          [ -s notes.md ] || git log -1 --format=%B > notes.md
          printf '%s\n' '' '## Boot it' '' 'The release above includes `joshuatree-'"$v"'.iso`, a bootable disk image. Write it to a USB stick to boot on real hardware:' '' 'macOS:' '```sh' 'diskutil list                    # find the disk (e.g. disk2)' 'sudo dd if=joshuatree-'"$v"'.iso of=/dev/rdiskN bs=4m' '```' '' 'Linux:' '```sh' 'lsblk                            # find the device (e.g. sdb)' 'sudo dd if=joshuatree-'"$v"'.iso of=/dev/sdX bs=4M status=progress conv=fsync' '```' '' 'This will erase the stick. Double-check the device path first. Boot the machine from the USB stick (F12/F10/Esc/Del at power-on for most PCs) to start the kernel.' '' 'The ISO is proven to boot in QEMU (CD-ROM and USB-style raw disk) via the CI regression suite. Real hardware testing is ongoing.' >> notes.md
          gh release create "$tag" --target "$GITHUB_SHA" -t "$v: ${title:-$(git log -1 --format=%s)}" -F notes.md joshuatree.iso "${{ env.ISO_FILE }}" SHA256SUMS
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "title=${title:-$(git log -1 --format=%s)}" >> "$GITHUB_OUTPUT"
      # README shows the mark from a release (a new URL per mark, so no cached copy of the old one lingers).
      # When README points at this release, or the mark changed in this merge, attach it: docs/brand/, written by
      # tools/gen/gen_brand_art.py.
      - name: Attach the README mark when README points at this release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          git fetch -q --depth=2 origin "$GITHUB_SHA" || true
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -c '^docs/brand/mark-' || true)
          if grep -q "releases/download/$tag/jt-mark-" README.md || [ "$changed" != 0 ]; then
            cp docs/brand/mark-ink.png jt-mark-ink.png
            cp docs/brand/mark-paper.png jt-mark-paper.png
            gh release upload "$tag" jt-mark-ink.png jt-mark-paper.png
            grep -q "releases/download/$tag/jt-mark-" README.md || echo "::warning::the mark changed but README still points at an older release; point it at $tag"
          else
            echo "README mark unchanged"
          fi
      - name: Announce the release on X (dry run until the X keys are set)
        if: steps.rel.outputs.tag != ''
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 tools/release-tweet.py "${{ steps.rel.outputs.tag }}" "${{ steps.rel.outputs.title }}" "https://github.com/${{ github.repository }}/releases/tag/${{ steps.rel.outputs.tag }}"
      - name: Update the X profile (picture, cover, bio) when a brand file changed
        if: steps.rel.outputs.tag != ''
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          git fetch -q --depth=2 origin "$GITHUB_SHA" || true
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null)
          for pair in "avatar x-avatar.png" "banner x-banner.png" "bio x-bio.txt"; do
            set -- $pair
            if echo "$changed" | grep -qx "landing/brand/$2"; then
              python3 tools/release-tweet.py --$1 "landing/brand/$2"
            else
              echo "$1 unchanged"
            fi
          done
