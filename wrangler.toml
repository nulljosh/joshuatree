name = "joshuatree"
compatibility_date = "2025-01-01"
main = "worker.js"

[assets]
directory = "landing"
binding = "ASSETS"

[[kv_namespaces]]
binding = "WAITLIST"
id = "97c2fc5f19fc4210bec0337bb7ae045f"

[[routes]]
pattern = "joshuatree.heyitsmejosh.com"
custom_domain = true

[observability]
enabled = true

[ai]
binding = "AI"

# Per-IP limit on /api/listen (Workers AI Whisper, worker.js's handleListen):
# 10 requests/minute per caller. This repo had no rate-limit binding before
# 1.6.23; handleListen degrades to "no limit" if this binding is ever
# absent (local dev, CI) instead of crashing.
[[ratelimits]]
name = "LISTEN_RATE_LIMITER"
namespace_id = "1601"

  [ratelimits.simple]
  limit = 10
  period = 60

# Per-IP limit on GET /api/speak (worker.js's handleSpeakGet): 30/minute.
[[ratelimits]]
name = "SPEAK_RATE_LIMITER"
namespace_id = "1602"

  [ratelimits.simple]
  limit = 30
  period = 60

# Per-IP limit on POST /api/mail/send (worker.js's handleMailSend): 3 per minute (a ratelimit binding only allows a 10 or 60 second period).
# The route refuses (503) when this binding is missing, it never runs unlimited.
[[ratelimits]]
name = "MAIL_RATE_LIMITER"
namespace_id = "1603"

  [ratelimits.simple]
  limit = 3
  period = 60
