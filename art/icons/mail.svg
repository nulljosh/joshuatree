  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#base)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="64" cy="6" rx="86" ry="54" fill="url(#gloss)"/>
    <g filter="url(#drop)">
      <rect x="22" y="41" width="84" height="55" rx="9" fill="url(#paper)"/>
      <path d="M26.5 46 L64 74 L101.5 46" fill="none" stroke="#C08A8A" stroke-width="5.5"
