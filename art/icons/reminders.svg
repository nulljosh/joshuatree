      <rect x="55" y="47.5" width="36" height="5" rx="2.5" fill="#C9C2BC"/>
      <rect x="35" y="61" width="14" height="14" rx="4" fill="none" stroke="#A8A099" stroke-width="2.6"/>
      <rect x="55" y="65.5" width="36" height="5" rx="2.5" fill="#6E6862"/>
      <rect x="35" y="79" width="14" height="14" rx="4" fill="none" stroke="#A8A099" stroke-width="2.6"/>
      <rect x="55" y="83.5" width="36" height="5" rx="2.5" fill="#6E6862"/>
    </g>
  </g>
  <rect x="0.7" y="0.7" width="126.6" height="126.6" rx="27.3" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
