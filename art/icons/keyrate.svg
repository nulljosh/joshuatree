<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C1A238"/><stop offset="1" stop-color="#907000"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E9E2DC"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.6" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <clipPath id="tile"><rect x="0" y="0" width="128" height="128" rx="28"/></clipPath>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#base)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="64" cy="6" rx="86" ry="54" fill="url(#gloss)"/>
    <g filter="url(#drop)">
      <rect x="20" y="38" width="88" height="52" rx="9" fill="#EFEAE3"/>
      <g fill="#3A3A3C">
        <rect x="27" y="45" width="15" height="13" rx="3.5"/>
        <rect x="45" y="45" width="15" height="13" rx="3.5"/>
        <rect x="63" y="45" width="15" height="13" rx="3.5"/>
        <rect x="81" y="45" width="20" height="13" rx="3.5"/>
        <rect x="27" y="61" width="20" height="13" rx="3.5"/>
        <rect x="50" y="61" width="15" height="13" rx="3.5"/>
        <rect x="68" y="61" width="15" height="13" rx="3.5"/>
        <rect x="86" y="61" width="15" height="13" rx="3.5"/>
        <rect x="38" y="77" width="52" height="8" rx="4"/>
      </g>
    </g>
  </g>
  <rect x="0.7" y="0.7" width="126.6" height="126.6" rx="27.3" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
</svg>
