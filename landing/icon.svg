<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Real Mojave desert palette (this repo's CLAUDE.md, same colors the
       kernel wallpaper/dock already use): silver sky fading through
       granite gray to the exact leather-brown (#6B4423) already used as
       one of the dock's own real accent colors. Warm sun glow reuses the
       exact gold (#FFE380/#FFA716) the in-kernel Weather icon already
       draws, one real palette, not a second one invented for this file.

       Redrawn against real reference (Yucca brevifolia): a stout,
       irregularly-branching trunk (Mormon settlers named it for a figure
       "praying with uplifted arms"), each branch capped with a DENSE
       rosette of many sharp, radiating spikes, not the sparse 3-line
       tuft the previous pass here drew, which read as antlers instead of
       a yucca crown once actually looked at, not assumed correct from
       the path data alone. -->
  <defs>
    <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEDEA"/>
      <stop offset="35%" stop-color="#C7BCA8"/>
      <stop offset="68%" stop-color="#8C6A3E"/>
      <stop offset="100%" stop-color="#4A2E14"/>
    </linearGradient>
    <!-- userSpaceOnUse, not the default per-shape bounding box: this tree
         is drawn as many separate path/line elements, and an
         objectBoundingBox gradient recomputes independently for each
         one's own tiny bbox, a real bug caught here on an earlier pass
         (the lower trunk nearly vanished into the background). Fixed
         coordinates make it one continuous light-from-above gradient
         across the whole tree regardless of how many shapes draw it. -->
    <linearGradient id="treeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="176">
      <stop offset="0%" stop-color="#4A3A26"/>
      <stop offset="100%" stop-color="#1C130A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="68%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FFE380" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFA716" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFA716" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A0602" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0A0602" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="18%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="82%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Real macOS Dock icons (see reference screenshot) all carry a
         glossy top sheen and a crisp 1px inner rim light, not just a flat
         gradient fill; the roundedSquare clip alone (already the correct
         ~22% squircle ratio) read as flat next to real ones once compared
         side by side. Two more overlays, no new shape language. -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect width="200" height="200" rx="44"/>
    </clipPath>
    <!-- One rosette: 7 spikes radiating from a point, real fullness
         instead of 3 sparse lines. Reused at the trunk top and both
         branch tips via <use>, rotated/scaled to fit each. -->
    <g id="rosette">
      <line x1="0" y1="0" x2="0"   y2="-22" stroke-width="4.5"/>
      <line x1="0" y1="0" x2="-9"  y2="-20" stroke-width="4.5"/>
      <line x1="0" y1="0" x2="9"   y2="-20" stroke-width="4.5"/>
      <line x1="0" y1="0" x2="-17" y2="-13" stroke-width="4"/>
      <line x1="0" y1="0" x2="17"  y2="-13" stroke-width="4"/>
      <line x1="0" y1="0" x2="-20" y2="-2"  stroke-width="4"/>
      <line x1="0" y1="0" x2="20"  y2="-2"  stroke-width="4"/>
    </g>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="200" height="200" fill="url(#desert)"/>
    <rect width="200" height="200" fill="url(#sunGlow)"/>
    <ellipse cx="100" cy="174" rx="44" ry="9" fill="url(#groundShadow)"/>

    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <!-- trunk, a slight organic kink instead of one dead-straight line -->
      <path d="M100 176 L98 140 L102 108 L100 88" stroke-width="13"/>
      <!-- two irregular arms at different heights, "uplifted", not a
           mirrored pair -->
      <path d="M100 152 Q72 140 60 100" stroke-width="10"/>
      <path d="M101 124 Q128 108 138 76" stroke-width="9"/>
    </g>
    <!-- fibrous bark texture (real reference: Yucca brevifolia's trunk is
         famously shaggy/plated, not smooth), a few short dark strokes
         along the trunk rather than one flat-looking pipe -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="94" y1="168" x2="97" y2="160"/>
      <line x1="103" y1="155" x2="100" y2="147"/>
      <line x1="95" y1="132" x2="98" y2="124"/>
      <line x1="104" y1="118" x2="101" y2="110"/>
    </g>

    <g stroke="#FFFFFF" stroke-linecap="round">
      <use href="#rosette" transform="translate(100 88) scale(1.05)"/>
      <use href="#rosette" transform="translate(60 100) rotate(-18) scale(0.85)"/>
      <use href="#rosette" transform="translate(138 76) rotate(16) scale(0.9)"/>
    </g>

    <!-- a thin rim light on the trunk's sun-facing edge -->
    <path d="M96 172 L94 141 L98 109" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <rect width="200" height="200" fill="url(#vignette)"/>
    <ellipse cx="100" cy="6" rx="130" ry="70" fill="url(#gloss)"/>
  </g>
  <!-- inner rim light, outside the clip so it traces the squircle's own
       edge (a stroked rect inside a clip of the same rect gets half-cut
       by the clip itself); every real Dock icon has this crisp hairline,
       the flat clip alone reads like a screenshot crop, not an icon -->
  <rect x="1" y="1" width="198" height="198" rx="43" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
