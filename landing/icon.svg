<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- v0.85: simplified tree engraving theme. One ink #000000 on one paper
       #ece8df, no greys, no gradients, no accent colour. Tone from line
       density, not colour. Simplified tree mark (landing/mark.png) with
       clean vector paths, readable at all sizes from 16px up. -->
  <defs>
    <clipPath id="roundedSquare">
      <rect width="200" height="200" rx="44"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <!-- cream paper background -->
    <rect width="200" height="200" fill="#ece8df"/>

    <!-- simplified tree: trunk and three branches with sparse rosette crowns -->
    <g fill="#000000">
      <!-- main trunk -->
      <path d="M93 175 L91 145 L96 110 L93 85 L107 85 L104 110 L109 145 L107 175 Z"/>

      <!-- left branch -->
      <path d="M96 155 Q75 145 60 110 L70 105 Q85 135 100 148 Z"/>

      <!-- right branch -->
      <path d="M104 130 Q125 115 145 80 L152 86 Q132 120 108 140 Z"/>

      <!-- left crown (top branch) - simplified radial spikes -->
      <g transform="translate(100 85)">
        <path d="M0 0 L-2 -8 L-1 -3 Z"/>
        <path d="M0 0 L-6 -6 L-3 -2 Z"/>
        <path d="M0 0 L-8 0 L-3 -1 Z"/>
        <path d="M0 0 L-6 5 L-2 1 Z"/>
        <path d="M0 0 L0 8 L0 2 Z"/>
        <path d="M0 0 L6 5 L2 1 Z"/>
        <path d="M0 0 L8 0 L3 -1 Z"/>
        <path d="M0 0 L6 -6 L3 -2 Z"/>
        <path d="M0 0 L2 -8 L1 -3 Z"/>
      </g>

      <!-- left branch crown - simplified spikes -->
      <g transform="translate(60 110)">
        <path d="M0 0 L-2 -7 L-1 -2 Z"/>
        <path d="M0 0 L-5 -5 L-2 -1 Z"/>
        <path d="M0 0 L-7 0 L-2 -1 Z"/>
        <path d="M0 0 L-5 4 L-1 1 Z"/>
        <path d="M0 0 L0 7 L0 2 Z"/>
        <path d="M0 0 L5 4 L1 1 Z"/>
        <path d="M0 0 L7 0 L2 -1 Z"/>
        <path d="M0 0 L5 -5 L2 -1 Z"/>
        <path d="M0 0 L2 -7 L1 -2 Z"/>
      </g>

      <!-- right branch crown - simplified spikes -->
      <g transform="translate(145 80)">
        <path d="M0 0 L-2 -7 L-1 -2 Z"/>
        <path d="M0 0 L-5 -5 L-2 -1 Z"/>
        <path d="M0 0 L-7 0 L-2 -1 Z"/>
        <path d="M0 0 L-5 4 L-1 1 Z"/>
        <path d="M0 0 L0 7 L0 2 Z"/>
        <path d="M0 0 L5 4 L1 1 Z"/>
        <path d="M0 0 L7 0 L2 -1 Z"/>
        <path d="M0 0 L5 -5 L2 -1 Z"/>
        <path d="M0 0 L2 -7 L1 -2 Z"/>
      </g>
    </g>
  </g>
</svg>
