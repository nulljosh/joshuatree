<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1232" viewBox="0 0 640 1232" style="background:#faf8f4;font-family:Tree Sans,-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b5502c"/></marker></defs>
<rect width="100%" height="100%" fill="#faf8f4"/>
<path d="" stroke="#ded9cd" fill="none"/>
<text x="320.0" y="30" fill="#161513" font-size="18" font-weight="700" text-anchor="middle">Joshua Tree at a glance</text>
<text x="320.0" y="48" fill="#5c584f" font-size="11" text-anchor="middle">A computer that knows what you want before you ask, and keeps it on your machine.</text>
<text x="20" y="78" fill="#5c584f" font-size="10" font-weight="600" letter-spacing="1">WHERE IT RUNS</text>
<rect x="20" y="86" width="135" height="42" rx="8" fill="#ffffff" stroke="#ded9cd"/>
<text x="87.5" y="105.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
<text x="87.5" y="118.0" fill="#161513" font-size="10" text-anchor="middle">the landing page</text>
<rect x="175" y="86" width="135" height="42" rx="8" fill="#ffffff" stroke="#ded9cd"/>
<text x="242.5" y="105.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">QEMU</text>
<text x="242.5" y="118.0" fill="#161513" font-size="10" text-anchor="middle">dev and CI</text>
<rect x="330" y="86" width="135" height="42" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="397.5" y="105.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Raspberry Pi 4</text>
<text x="397.5" y="118.0" fill="#161513" font-size="10" text-anchor="middle">the real board</text>
<rect x="485" y="86" width="135" height="42" rx="8" fill="#ffffff" stroke="#ded9cd"/>
<text x="552.5" y="105.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Real PC</text>
<text x="552.5" y="118.0" fill="#161513" font-size="10" text-anchor="middle">from a USB stick</text>
<text x="320.0" y="146" fill="#5c584f" font-size="10" text-anchor="middle">The same layers in all four places. Each one only talks to the one under it:</text>
<rect x="20" y="154" width="600" height="38" rx="8" fill="#1c1c1e" fill-opacity=".12" stroke="#1c1c1e"/>
<text x="320.0" y="171.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Apps</text>
<text x="320.0" y="184.0" fill="#161513" font-size="10" text-anchor="middle">32 apps, each in its own walled-off memory, so one crash stays one crash</text>
<path d="M80 193v9" stroke="#b5502c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="90" y="201" fill="#5c584f" font-size="9">asks by system call</text>
<rect x="20" y="204" width="600" height="38" rx="8" fill="#1c1c1e" fill-opacity=".12" stroke="#1c1c1e"/>
<text x="320.0" y="221.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Desktop and Samantha</text>
<text x="320.0" y="234.0" fill="#161513" font-size="10" text-anchor="middle">windows, dock and menu bar; Samantha runs what you type or say</text>
<path d="M80 243v9" stroke="#b5502c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="90" y="251" fill="#5c584f" font-size="9">draws off-screen, then shows it</text>
<rect x="20" y="254" width="600" height="38" rx="8" fill="#1c1c1e" fill-opacity=".12" stroke="#1c1c1e"/>
<text x="320.0" y="271.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Kernel</text>
<text x="320.0" y="284.0" fill="#161513" font-size="10" text-anchor="middle">takes turns between apps, stops one frozen for 3 s, files, network</text>
<path d="M80 293v9" stroke="#b5502c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="90" y="301" fill="#5c584f" font-size="9">drives the parts</text>
<rect x="20" y="304" width="600" height="38" rx="8" fill="#1c1c1e" fill-opacity=".12" stroke="#1c1c1e"/>
<text x="320.0" y="321.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Drivers</text>
<text x="320.0" y="334.0" fill="#161513" font-size="10" text-anchor="middle">screen, USB keyboard, mouse and mic, Wi-Fi, Bluetooth, SD card, sound</text>
<rect x="20" y="354" width="600" height="38" rx="8" fill="#ffffff" stroke="#ded9cd"/>
<text x="320.0" y="371.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">The machine</text>
<text x="320.0" y="384.0" fill="#161513" font-size="10" text-anchor="middle">a Raspberry Pi 4, a PC, or QEMU pretending to be one</text>
<text x="320.0" y="420" fill="#5c584f" font-size="10" text-anchor="middle">Out on the internet: Turing (her brain), ElevenLabs (her voice), a Cloudflare Worker and Open-Meteo.</text>
<g transform="translate(0,130)">
<text x="20" y="320" fill="#5c584f" font-size="10" font-weight="600" letter-spacing="1">WHAT HAPPENS WHEN YOU TALK TO SAMANTHA</text>
<rect x="20.0" y="330" width="139.5" height="40" rx="8" fill="#ffffff" stroke="#ded9cd"/>
<text x="89.75" y="348.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">You type or say</text>
<text x="89.75" y="361.0" fill="#161513" font-size="10" text-anchor="middle">"call Mom at 5"</text>
<path d="M161.5 350h8.0" stroke="#b5502c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="173.5" y="330" width="139.5" height="40" rx="8" fill="#ffffff" stroke="#ded9cd"/>
<text x="243.25" y="348.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Turing</text>
<text x="243.25" y="361.0" fill="#161513" font-size="10" text-anchor="middle">picks the tool</text>
<path d="M315.0 350h8.0" stroke="#b5502c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="327.0" y="330" width="139.5" height="40" rx="8" fill="#1c1c1e" fill-opacity=".12" stroke="#1c1c1e"/>
<text x="396.75" y="348.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Joshua Tree</text>
<text x="396.75" y="361.0" fill="#161513" font-size="10" text-anchor="middle">does it</text>
<path d="M468.5 350h8.0" stroke="#b5502c" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="480.5" y="330" width="139.5" height="40" rx="8" fill="#1c1c1e" fill-opacity=".12" stroke="#1c1c1e"/>
<text x="550.25" y="348.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">She answers</text>
<text x="550.25" y="361.0" fill="#161513" font-size="10" text-anchor="middle">voice and face</text>
<text x="20" y="400" fill="#5c584f" font-size="10" font-weight="600" letter-spacing="1">THE PI, ON THE REAL BOARD</text>
