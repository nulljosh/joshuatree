<text x="550.25" y="603.0" fill="#5c584f" font-size="8" text-anchor="middle">headphone jack</text>
<rect x="20.0" y="626" width="139.5" height="40" rx="8" fill="#ffffff" stroke="#5c584f" stroke-dasharray="3 3"/>
