<text x="89.75" y="428.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Screen</text>
<text x="89.75" y="441.0" fill="#161513" font-size="10" text-anchor="middle">1080p desktop</text>
<rect x="173.5" y="410" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="243.25" y="428.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Keyboard</text>
<text x="243.25" y="441.0" fill="#161513" font-size="10" text-anchor="middle">USB, hot-plug</text>
<rect x="327.0" y="410" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="396.75" y="428.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Wi-Fi</text>
<text x="396.75" y="441.0" fill="#161513" font-size="10" text-anchor="middle">WPA2, joined</text>
<rect x="480.5" y="410" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="550.25" y="428.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Internet</text>
<text x="550.25" y="441.0" fill="#161513" font-size="10" text-anchor="middle">DHCP and DNS</text>
<rect x="20.0" y="464" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="89.75" y="482.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Clock</text>
<text x="89.75" y="495.0" fill="#161513" font-size="10" text-anchor="middle">from the net</text>
<rect x="173.5" y="464" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="243.25" y="482.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Terminal</text>
<text x="243.25" y="495.0" fill="#161513" font-size="10" text-anchor="middle">zsh style, sam</text>
<rect x="327.0" y="464" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="396.75" y="482.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Samantha</text>
<text x="396.75" y="495.0" fill="#161513" font-size="10" text-anchor="middle">chat on the Pi</text>
<rect x="480.5" y="464" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="550.25" y="482.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Pi actions</text>
<text x="550.25" y="495.0" fill="#161513" font-size="10" text-anchor="middle">note, green light</text>
<rect x="20.0" y="518" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="89.75" y="536.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">HTTPS</text>
<text x="89.75" y="549.0" fill="#161513" font-size="10" text-anchor="middle">Browser, 37 roots</text>
<rect x="173.5" y="518" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="243.25" y="536.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
<text x="243.25" y="549.0" fill="#161513" font-size="10" text-anchor="middle">window, links</text>
<rect x="327.0" y="518" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="396.75" y="536.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Books</text>
<text x="396.75" y="549.0" fill="#161513" font-size="10" text-anchor="middle">plain text</text>
