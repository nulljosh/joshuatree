<text x="89.75" y="603.0" fill="#161513" font-size="10" text-anchor="middle">saved to the card</text>
<rect x="173.5" y="572" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
<text x="243.25" y="590.0" fill="#161513" font-size="11" font-weight="600" text-anchor="middle">Calendar</text>
<text x="243.25" y="603.0" fill="#161513" font-size="10" text-anchor="middle">four views</text>
<rect x="327.0" y="572" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
