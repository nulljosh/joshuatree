<text x="396.75" y="603.0" fill="#161513" font-size="10" text-anchor="middle">mouse pairs</text>
<rect x="480.5" y="572" width="139.5" height="40" rx="8" fill="#ffffff" stroke="#5c584f" stroke-dasharray="3 3"/>
