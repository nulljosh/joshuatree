<text x="550.25" y="549.0" fill="#161513" font-size="10" text-anchor="middle">wav, mp3, covers</text>
<rect x="20.0" y="572" width="139.5" height="40" rx="8" fill="#b5502c" fill-opacity=".12" stroke="#b5502c"/>
