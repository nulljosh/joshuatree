# Limine boot menu for the ISO/USB image. One entry, no timeout: this
# kernel has nothing else to dual-boot into, so sitting on a menu would
# just be a wasted screen on every real boot.
#
# protocol: multiboot1 matches boot/boot.S's multiboot1 header (magic
# 0x1BADB002). Limine loads kernel.elf exactly the way QEMU's own -kernel
# flag does: eax = multiboot magic, ebx = multiboot info struct pointer,
# handed to _start the same way boot/boot.S already expects.
timeout: 0

/Joshua Tree
    protocol: multiboot1
    kernel_path: boot():/boot/kernel.elf
